<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Record Management System</title>
    <link rel="stylesheet" href="systemStyle.css">
</head>
<body>

    <header>
        <h1>Student Record Management System</h1>
        <p>Manage student information easily</p>
    </header>

    <main class="container">

        <section class="form-section">
            <h2 id="formTitle">Add Student Record</h2>

            <form id="studentForm">
                <input type="text" id="studentId"
                    placeholder="Student ID" maxlength="6" required>

                <input type="text" id="studentFirstName"
                    placeholder="Student First Name" required>

                <input type="number" id="studentAge"
                    placeholder="Age" min="13" max="30" required>

                <input type="text" id="studentLastName"
                    placeholder="Student Last Name" required>

                <select id="studentCourse" required>
                    <option value="" disabled selected>Select Course</option>
                    <option value="BSIT">BSIT</option>
                    <option value="BSCS">BSCS</option>
                    <option value="ACT">ACT</option>
                </select>


                <input type="number" id="studentGpa"
                    placeholder="GPA (1.00 - 4.00)"
                    min="1" max="4" step="0.01" required>

                <button type="submit" id="submitButton">
                    Add Student
                </button>

                <button type="button" id="cancelButton"
                    class="cancel-btn" hidden>
                    Cancel
                </button>
            </form>
        </section>

        <section class="records-section">
            <h2>Student Records</h2>

            <input type="text" id="searchInput"
                placeholder="Search by ID or student name...">

           <div class="sort-buttons">
                <button onclick="sortByID()">Sort by ID</button>
                <button onclick="sortByName()">Sort by Name</button>
                <button onclick="sortByGPA()">Sort by GPA</button>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Student ID</th>
                            <th>Last Name</th>
                            <th>First Name</th>
                            <th>Age</th>
                            <th>Course</th>
                            <th>GPA</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="studentTable">
                    </tbody>
                </table>
            </div>

            <p id="recordCount">Total Students: 0</p>
        </section>

    </main>

    <footer>
        <p>Student Record Management System</p>
    </footer>

    <script src="function.js"></script>
</body>
</html>
